---
#------------------------------------------------------------------------------
# Lint, test (LiquidJS rendering and schema tests) and Theme Check the theme
# app extension. Never deploys: deploying is the app owner's step.
#------------------------------------------------------------------------------
name: Test

on:
  workflow_dispatch:
  push:
    branches: [main, alpha, beta]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Theme Check
        run: npm run theme-check
